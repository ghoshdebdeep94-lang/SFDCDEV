<template>
  <div class="slds-p-around-medium">
    <div class="slds-box slds-theme_warning">
      <p class="slds-m-bottom-medium">
        <strong>Are you sure you want to delete this record?</strong><br />
        This action cannot be undone.
      </p>
      <lightning-button
        variant="destructive"
        label="Confirm Delete"
        onclick={handleDelete}
        class="slds-m-right-small"
      >
      </lightning-button>
      <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}>
      </lightning-button>
    </div>
  </div>
</template>
