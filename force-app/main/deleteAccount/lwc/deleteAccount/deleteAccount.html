<template>
    <lightning-card title="Delete">
        <div class="slds-p-around-medium">
            <template if:false={showConfirmation}>
                <lightning-button
                    variant="destructive"
                    label="Delete Record"
                    onclick={handleDelete}>
                </lightning-button>
            </template>

            <template if:true={showConfirmation}>
                <div class="slds-box slds-theme_warning">
                    <p class="slds-m-bottom-medium">
                        <strong>Are you sure you want to delete this record?</strong><br/>
                        This action cannot be undone.
                    </p>
                    <lightning-button
                        variant="destructive"
                        label="Confirm Delete"
                        onclick={handleConfirmDelete}
                        class="slds-m-right-small">
                    </lightning-button>
                    <lightning-button
                        variant="neutral"
                        label="Cancel"
                        onclick={handleCancelDelete}>
                    </lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
