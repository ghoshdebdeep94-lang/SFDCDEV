<template>
  <lightning-input
    type="number"
    label="Limit"
    onchange={handleChange}
  ></lightning-input>
  <lightning-button
    label="Get Contacts"
    onclick={getContacts}
  ></lightning-button>

  <template if:true={contacts}>
    <lightning-accordion allow-multiple-sections-open>
      <template for:each={contacts} for:item="contact">
        <lightning-accordion-section key={contact.Id} label={contact.Name}>
          <div class="slds-card slds-var-m-around_medium">
            Name: {contact.Name} <br />
            Email: {contact.Email}
          </div>
        </lightning-accordion-section>
      </template>
    </lightning-accordion>
  </template>
</template>
